services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railcast
      POSTGRES_USER: railcast
      POSTGRES_PASSWORD: railcast
    ports:
      - "5432:5432"
    volumes:
      - railcast_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railcast -d railcast"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      RAILCAST_MODE: DEMO
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://railcast:railcast@postgres:5432/railcast
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ADMIN_API_KEY: ""
      ADMIN_AUTH_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  streaming-worker:
    build: .
    command: ["python", "-m", "app.streaming.worker"]
    environment:
      ENVIRONMENT: development
      RAILCAST_MODE: DEMO
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://railcast:railcast@postgres:5432/railcast
      REDIS_URL: redis://redis:6379/0
      STREAMING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  railcast_postgres_data:
